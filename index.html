<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noxy.ai - Free AI Chatbot</title>
    <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap)" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080a0f;
            --panel-bg: rgba(18, 22, 34, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-pink: #ff4081;
            --accent-purple: #8e24aa;
            --accent-gradient: linear-gradient(135deg, #ff4081, #7c4dff);
            --user-msg: linear-gradient(135deg, #e91e63, #9c27b0);
            --ai-msg: rgba(255, 255, 255, 0.07);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 64, 129, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(124, 77, 255, 0.15) 0%, transparent 45%);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        .chat-app {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 1000px;
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (min-width: 768px) {
            .chat-app {
                height: 92vh;
                border-radius: 28px;
                border: 1px solid var(--panel-border);
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            }
        }

        /* HEADER */
        .header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(8, 10, 15, 0.6);
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 10px rgba(255, 64, 129, 0.3);
        }

        .bot-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.2;
        }

        .bot-sub {
            font-size: 11px;
            color: var(--text-sub);
        }

        .mode-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px;
            border-radius: 20px;
            border: 1px solid var(--panel-border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 64, 129, 0.3);
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* CHAT BODY */
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            animation: slideUp 0.2s cubic-bezier(0, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        .code-block {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 8px;
            overflow-x: auto;
            color: #4fc3f7;
            white-space: pre-wrap;
        }

        /* SUGGESTIONS */
        .suggestions {
            display: flex;
            gap: 8px;
            padding: 0 16px 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .suggestions::-webkit-scrollbar { display: none; }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
        }

        /* INPUT FOOTER */
        .footer {
            padding: 12px 16px 20px;
            border-top: 1px solid var(--panel-border);
            background: rgba(8, 10, 15, 0.7);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-bar {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 4px 6px 4px 14px;
        }

        .input-bar:focus-within {
            border-color: var(--accent-pink);
        }

        .input-box {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
            padding: 8px 0;
        }

        .send-btn {
            background: var(--accent-gradient);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .tool-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
            padding: 0 4px;
        }

        .toggle-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* POPUPS */
        .popup-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 999;
        }

        @media (min-width: 768px) {
            .popup-overlay { align-items: center; }
        }

        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-card {
            background: #121622;
            border-top: 1px solid var(--panel-border);
            border-radius: 24px 24px 0 0;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            .popup-card {
                border-radius: 24px;
                border: 1px solid var(--panel-border);
                transform: translateY(20px);
            }
        }

        .popup-overlay.active .popup-card {
            transform: translateY(0);
        }

        .popup-title {
            font-size: 18px;
            font-weight: 700;
        }

        .popup-action-btn {
            background: var(--accent-gradient);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>

    <script>
        const chatBody = document.getElementById('chat-body');
        let currentMode = 'fast';

        window.onload = () => {
            const saved = localStorage.getItem('noxy_chat_history');
            if (saved) {
                chatBody.innerHTML = saved;
                chatBody.scrollTop = chatBody.scrollHeight;
            }
        };

        function setMode(btn, mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
        }

        function useSuggestion(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(escapeHTML(text), 'user');
            input.value = '';

            setTimeout(() => {
                const response = generateResponse(text);
                appendMessage(response, 'ai');
            }, 400);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function appendMessage(text, sender) {
            const msgNode = document.createElement('div');
            msgNode.className = `message ${sender}`;
            msgNode.innerHTML = text;

            chatBody.appendChild(msgNode);
            chatBody.scrollTop = chatBody.scrollHeight;
            localStorage.setItem('noxy_chat_history', chatBody.innerHTML);
        }

        function generateResponse(input) {
            const query = input.toLowerCase().trim();
            const searchEnabled = document.getElementById('web-search').checked;
            let prefix = searchEnabled ? "🌐 <i>[Web Search Active]</i><br>" : "";

            if (currentMode === 'fun') {
                return prefix + "Haha, wild request! \"" + escapeHTML(input) + "\"? Absolutely on it! 🔥";
            } else if (currentMode === 'think') {
                return prefix + "🧠 <b>[Deep Think Mode]</b><br>Analyzing prompt structure...<br><br>Here is a detailed breakdown for: " + escapeHTML(input);
            }

            if (query.includes('hello') || query.includes('hi')) {
                return prefix + "Hello! I am <b>Noxy.ai</b>. What are we building or solving today?";
            } else if (query.includes('code') || query.includes('python') || query.includes('script')) {
                return prefix + "Here is a clean code example for you:<div class=\"code-block\"># Noxy.ai Generated Script\ndef hello_noxy():\n    print('Hello from Noxy.ai!')\n\nhello_noxy()</div>";
            } else {
                return prefix + "Noxy.ai received your prompt: <b>" + escapeHTML(input) + "</b>. Let me know if you need code snippets or extra details!";
            }
        }

        function handleFile(input) {
            if (input.files && input.files[0]) {
                appendMessage(`📎 Attached file: <b>${escapeHTML(input.files[0].name)}</b>`, 'user');
                setTimeout(() => {
                    appendMessage(`Analyzed file: <b>${escapeHTML(input.files[0].name)}</b>. How would you like me to process this?`, 'ai');
                }, 600);
            }
        }

        function openPopup(id) { document.getElementById(id).classList.add('active'); }
        function closePopup(id) { document.getElementById(id).classList.remove('active'); }

        function clearChat() {
            chatBody.innerHTML = '<div class="message ai">Hi! I am <b>Noxy.ai</b>, your free AI chatbot. How can I help you today?</div>';
            localStorage.removeItem('noxy_chat_history');
            closePopup('clear-popup');
        }
    </script>
</body>
</html>
