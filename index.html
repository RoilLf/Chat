<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noxy.ai - Free AI Chatbot</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(23, 31, 51, 0.7);
            --panel-border: rgba(255, 255, 255, 0.12);
            --user-msg-bg: linear-gradient(135deg, #e91e63, #9c27b0);
            --ai-msg-bg: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --accent-pink: #ff69b4;
            --accent-purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 105, 180, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-color);
        }

        .chat-app {
            width: 95vw;
            max-width: 1050px;
            height: 92vh;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        /* --- HEADER --- */
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.4);
        }

        .mode-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            gap: 4px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent-pink);
            color: #000;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- CHAT BODY --- */
        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg-bg);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        .code-block {
            background: #0d1117;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            color: #e6edf3;
            overflow-x: auto;
        }

        /* --- GEMINI STYLE SUGGESTIONS --- */
        .suggestions {
            display: flex;
            gap: 10px;
            padding: 0 24px 12px;
            overflow-x: auto;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip:hover {
            border-color: var(--accent-pink);
            color: var(--text-color);
        }

        /* --- FOOTER INPUT --- */
        .footer {
            padding: 16px 24px;
            border-top: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 14px 18px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-box:focus {
            border-color: var(--accent-pink);
        }

        .tool-bar {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            align-items: center;
        }

        .toggle-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 14px 24px;
            border-radius: 14px;
            cursor: pointer;
        }

        /* --- POPUP OVERLAYS --- */
        .popup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
            border-radius: 24px;
        }

        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-card {
            background: #131b2e;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 24px;
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>

                <div>
                    <div style="font-weight: 700; font-size: 16px;">Noxy.ai</div>
                    <div style="font-size: 12px; color: var(--text-secondary);">Free Ai chat bot</div>
                </div>
            </div>

            <!-- Grok-Style Modes -->
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode(this, 'fast')">⚡ Fast</button>
                <button class="mode-btn" onclick="setMode(this, 'think')">🧠 Think</button>
                <button class="mode-btn" onclick="setMode(this, 'fun')">🔥 Fun</button>
            </div>

            <div class="header-actions">
                <button class="icon-btn" onclick="openPopup('settings-popup')" title="Settings">⚙️</button>
                <button class="icon-btn" onclick="openPopup('clear-popup')" title="Clear Chat">🗑️</button>
            </div>
        </div>

        <!-- CHAT BODY -->
        <div class="chat-body" id="chat-body">
            <div class="message ai">Hi! I am <b>Noxy.ai</b>, your free AI chatbot. How can I help you today?</div>
        </div>

        <!-- Gemini-Style Suggestion Chips -->
        <div class="suggestions">
            <div class="chip" onclick="useSuggestion('Write a Python script for a discord bot')">🐍 Python Bot</div>
            <div class="chip" onclick="useSuggestion('Explain quantum computing simply')">⚛️ Quantum Physics</div>
            <div class="chip" onclick="useSuggestion('Give me 5 creative business ideas')">💡 Business Ideas</div>
        </div>

        <!-- FOOTER INPUT -->
        <div class="footer">
            <div class="input-container">
                <input type="text" id="user-input" class="input-box" placeholder="Ask Noxy.ai anything..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
            
            <div class="tool-bar">
                <!-- ChatGPT & Gemini Style Toggles -->
                <label class="toggle-btn">
                    <input type="checkbox" id="web-search"> 🌐 Web Search
                </label>
                <label class="toggle-btn" onclick="triggerFileUpload()">
                    📎 Attach File/Image
                </label>
                <input type="file" id="file-input" style="display:none;" onchange="handleFile(this)">
            </div>
        </div>

        <!-- SETTINGS POPUP -->
        <div class="popup-overlay" id="settings-popup">
            <div class="popup-card">
                <h3 style="font-size: 18px;">Noxy.ai Settings</h3>
                <p style="font-size: 13px; color: var(--text-secondary);">Customize your chatbot interface:</p>
                <label class="toggle-btn">
                    <input type="checkbox" id="stream-toggle" checked> Enable Text Streaming
                </label>
                <button class="send-btn" onclick="closePopup('settings-popup')">Save & Close</button>
            </div>
        </div>

        <!-- CLEAR CONFIRMATION POPUP -->
        <div class="popup-overlay" id="clear-popup">
            <div class="popup-card">
                <h3 style="font-size: 18px;">Clear Messages?</h3>
                <p style="font-size: 13px; color: var(--text-secondary);">This will clear your conversation history locally.</p>
                <button class="send-btn" style="background: #ef4444;" onclick="clearChat()">Confirm Clear</button>
                <button class="icon-btn" style="width: 100%; border-radius: 14px;" onclick="closePopup('clear-popup')">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById('chat-body');
        let currentMode = 'fast';

        window.onload = () => {
            const saved = localStorage.getItem('noxy_chat_history');
            if (saved) {
                chatBody.innerHTML = saved;
                chatBody.scrollTop = chatBody.scrollHeight;
            }
        };

        function setMode(btn, mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
        }

        function useSuggestion(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            setTimeout(() => {
                const response = generateResponse(text);
                appendMessage(response, 'ai');
            }, 600);
        }

        function appendMessage(text, sender) {
            const msgNode = document.createElement('div');
            msgNode.className = `message ${sender}`;
            
            // Format code blocks
            if (text.includes('```')) {
                const parts = text.split('```');
                msgNode.innerHTML = parts[0] + `<div class="code-block">${parts[1]}</div>` + (parts[2] || '');
            } else {
                msgNode.innerHTML = text;
            }

            chatBody.appendChild(msgNode);
            chatBody.scrollTop = chatBody.scrollHeight;
            localStorage.setItem('noxy_chat_history', chatBody.innerHTML);
        }

        // Response generator combining features
        function generateResponse(input) {
            const query = input.toLowerCase();
            const searchEnabled = document.getElementById('web-search').checked;

            let prefix = "";
            if (searchEnabled) {
                prefix = "🌐 <i>[Web Search Active]</i><br>";
            }

            if (currentMode === 'fun') {
                return prefix + "Haha, alright! Let's get chaotic. " + input + "? Absolutely wild request, but I'm here for it! 🔥";
            } else if (currentMode === 'think') {
                return prefix + "🧠 <b>[Deep Thinking Mode]</b><br>Analyzing prompt structure...<br><br>Here is a detailed breakdown regarding your query about " + input + ".";
            }

            if (query.includes('hello') || query.includes('hi')) {
                return prefix + "Hello! I am <b>Noxy.ai</b>. What are we creating or solving today?";
            } else if (query.includes('code') || query.includes('python') || query.includes('script')) {
                return prefix + "Here is a clean code example for you:\n```python\n# Noxy.ai Generated Script\ndef hello_noxy():\n    print('Hello from Noxy.ai!')\n\nhello_noxy()\n```";
            } else {
                return prefix + "I processed your request using Noxy.ai. Let me know if you need any adjustments or deeper code snippets!";
            }
        }

        function triggerFileUpload() {
            document.getElementById('file-input').click();
        }

        function handleFile(input) {
            if (input.files && input.files[0]) {
                appendMessage(`📎 Attached file: <b>${input.files[0].name}</b>`, 'user');
                setTimeout(() => {
                    appendMessage(`I have analyzed the attached file (<b>${input.files[0].name}</b>). How would you like me to process it?`, 'ai');
                }, 800);
            }
        }

        function openPopup(id) { document.getElementById(id).classList.add('active'); }
        function closePopup(id) { document.getElementById(id).classList.remove('active'); }

        function clearChat() {
            chatBody.innerHTML = '<div class="message ai">Hi! I am <b>Noxy.ai</b>, your free AI chatbot. How can I help you today?</div>';
            localStorage.removeItem('noxy_chat_history');
            closePopup('clear-popup');
        }
    </script>
</body>
</html>
